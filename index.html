<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="전공과 학년에 상관없이 함께하는 동국대학교 Google Developer Groups on Campus(GDGoC DGU)입니다. 화요일엔 같은 문제를 각자 풀고 서로의 풀이를 보고, 한 학기 팀 프로젝트 G-Sprint로 서비스를 만듭니다. 선배들이 만든 프로젝트와 5기 모집 소식을 안내합니다." />
    <meta name="theme-color" content="#ffffff" />
    <!-- 링크를 공유할 때 보이는 카드 (카카오톡 · 인스타 DM · 슬랙 등) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GDGoC DGU" />
    <meta property="og:title" content="GDGoC DGU · 동국대학교 Google Developer Groups on Campus" />
    <!-- 지원자가 처음 보는 첫 화면 문장과 같은 결 (시제가 바뀌지 않는 문장만: 데모데이 뒤에도 맞게) -->
    <meta property="og:description" content="전공 · 학년 상관없이, 9월에 만나 12월엔 한 팀으로 서비스를 냅니다." />
    <meta property="og:locale" content="ko_KR" />
    <!--
      공유 카드 그림 1200×630 (public/og.png. 다시 만드는 법은 scripts/og/render.mjs 머리 주석).
      카카오톡 · 페이스북 · X 는 상대 주소를 읽지 못해 절대 주소로 쓴다. 도메인이 바뀌면 og:url · og:image 를 함께 고친다.
    -->
    <meta property="og:url" content="https://gdghomepage.vercel.app/" />
    <meta property="og:image" content="https://gdghomepage.vercel.app/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="9월에 처음 만난 사람들이 12월엔 한 팀으로 서비스를 냅니다. GDGoC DGU 캠퍼스 지도 그림." />
    <meta name="twitter:card" content="summary_large_image" />
    <title>GDGoC DGU · 동국대학교 Google Developer Groups on Campus</title>
    <!-- 글꼴: 영문·숫자 Google Sans Flex, 한글 Pretendard (디자인 시스템 기준) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400..700&display=swap" />
    <!-- 손글씨 층(지도 메모): 나눔손글씨 펜 (OFL 1.1). 메모에 쓰는 글자만 받는다(text=). 메모 문구를 바꾸면 여기 글자도 더한다 -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap&text=%EB%A7%A4%EC%A3%BC%ED%99%94%EC%9A%94%EC%9D%BC%EC%84%B8%EC%85%98%EB%A7%8C%EB%93%9C%EB%8A%94%EC%A4%91%EB%8D%B0%EB%AA%A8%EB%8D%B0%EC%9D%B4%ED%8C%80GSprint0123456789.%3A-%21%20" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<!--
  공유 카드(og:image) 원본: 1200×630. scripts/og/render.mjs 가 이 파일에 실제 홈 지도 캡처를 끼워 public/og.png 로 찍는다.
  문구는 홈 첫 화면 h1(src/content/story.ts HERO.title) 그대로. 숫자 · 모집 상태 · 기수처럼 바뀌는 말은 넣지 않는다
  (그림은 한번 퍼지면 고칠 수 없다). '서비스를 냅니다' 는 해마다 되풀이되는 일이라 데모데이 뒤에도 맞다.
-->
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400..700&display=swap" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <style>
      :root {
        --paper: #ffffff;
        --ink-900: #191b1f;
        --ink-700: #474c55;
        --line: #e4e6e9;
        --g-blue: #4285f4;
        --g-red: #ea4335;
        --g-yellow: #fbbc04;
        --g-green: #34a853;
        --font-kr: 'Pretendard Variable', Pretendard, sans-serif;
        --font-num: 'Google Sans Flex', 'Pretendard Variable', Pretendard, sans-serif;
      }
      html,
      body {
        margin: 0;
      }
      body {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink-900);
        font-family: var(--font-kr);
        word-break: keep-all;
        -webkit-font-smoothing: antialiased;
      }
      /* 실제 홈 지도 캡처. 오른쪽 · 아래로 흘려 보내고, 글자 쪽(왼쪽 · 위) 가장자리는 종이색으로 녹인다 */
      .campus {
        position: absolute;
        left: var(--campus-x, 296px);
        top: var(--campus-y, 218px);
        width: var(--campus-w, 1140px);
        height: auto;
        -webkit-mask-image: linear-gradient(to right, transparent 0, #000 24%), linear-gradient(to bottom, transparent 0, #000 7%);
        -webkit-mask-composite: source-in;
        mask-image: linear-gradient(to right, transparent 0, #000 24%), linear-gradient(to bottom, transparent 0, #000 7%);
        mask-composite: intersect;
      }
      .text {
        position: absolute;
        left: 72px;
        top: 64px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        font: 700 30px/1 var(--font-num);
        letter-spacing: -0.01em;
      }
      .dots {
        display: inline-flex;
        gap: 6px;
      }
      .dots i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }
      .dots i:nth-child(1) { background: var(--g-blue); }
      .dots i:nth-child(2) { background: var(--g-red); }
      .dots i:nth-child(3) { background: var(--g-yellow); }
      .dots i:nth-child(4) { background: var(--g-green); }
      h1 {
        margin: 40px 0 0;
        font: 800 64px/78px var(--font-kr);
        letter-spacing: -0.03em;
      }
      h1 span {
        display: block;
        white-space: nowrap;
      }
      /* 아래 왼쪽 두 줄: 지도 땅이 비치지 않게 종이색 받침 (오른쪽 · 위 끝은 녹인다) */
      .sub {
        position: absolute;
        left: 72px;
        bottom: 56px;
        margin: 0;
        font: 500 22px/32px var(--font-kr);
        color: var(--ink-700);
      }
      .sub::before {
        content: '';
        position: absolute;
        z-index: -1;
        inset: -72px -96px -56px -72px;
        background: radial-gradient(ellipse 66% 74% at 36% 72%, var(--paper) 62%, rgba(255, 255, 255, 0) 100%);
      }
      .sub b {
        display: block;
        font-weight: 600;
        color: var(--ink-900);
      }
    </style>
  </head>
  <body>
    <img class="campus" id="campus" src="campus.png" alt="" />
    <div class="text">
      <div class="brand">
        <span lang="en">GDGoC DGU</span>
        <span class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      </div>
      <h1>
        <span>9월에 처음 만난 사람들이</span>
        <span>12월엔 한 팀으로</span>
        <span>서비스를 냅니다.</span>
      </h1>
    </div>
    <p class="sub">
      <b>동국대학교 Google Developer Groups on Campus</b>
      전공 · 학년 상관없이 함께합니다
    </p>
  </body>
</html>
